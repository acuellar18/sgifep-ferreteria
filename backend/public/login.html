<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SGIFEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                    url('img/herramientas.jpg') center/cover no-repeat fixed;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        width: 90%;
        max-width: 920px;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        min-height: 520px;
        position: relative;
    }

    .login-image-side {
        width: 48%;
        background: url('img/herramientas.jpg') center/cover no-repeat; 
        position: relative;
    }

    .login-form-side {
        width: 52%;
        padding: 50px 45px 40px 45px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        position: relative;
    }

    .back-link {
        position: absolute;
        top: 20px;
        left: 25px;
        color: #666666;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #d85d00;
        text-decoration: underline;
    }

    .brand-logo {
        max-width: 140px;
        height: auto;
        margin-bottom: 25px;
    }

    .login-form {
        width: 100%;
        max-width: 310px;
    }

    .field-group {
        margin-bottom: 18px;
    }

    .field-group label {
        display: block;
        font-weight: 600;
        font-size: 0.95rem;
        color: #111111;
        margin-bottom: 6px;
    }

    .input-pill {
        width: 100%;
        padding: 10px 18px;
        border-radius: 25px;
        border: 1.5px solid #555555;
        outline: none;
        font-size: 0.9rem;
        color: #333333;
        transition: border-color 0.2s;
    }

    .input-pill:focus {
        border-color: #d85d00;
    }

    .btn-login-pill {
        width: 100%;
        background-color: #d85d00;
        color: #ffffff;
        border: none;
        border-radius: 25px;
        padding: 11px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(216, 93, 0, 0.3);
        transition: background-color 0.2s;
    }

    .btn-login-pill:hover {
        background-color: #c05200;
    }

    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #e53935;
        font-weight: 600;
        font-size: 0.85rem;
        text-decoration: none;
        cursor: pointer;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    #error-msg {
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
    }

    /* Estilos Modal */
    .modal-content {
        border-radius: 20px;
        border: none;
    }

    @media (max-width: 768px) {
        .login-container {
            flex-direction: column;
            max-width: 400px;
            margin: 20px;
        }
        .login-image-side {
            width: 100%;
            height: 180px;
        }
        .login-form-side {
            width: 100%;
            padding: 50px 20px 30px 20px;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-image-side"></div>

    <div class="login-form-side">
        <a href="index.html" class="back-link">← Volver a la página principal</a>

        <img src="img/logo.png" alt="SGIFEP Logo" class="brand-logo">

        <form class="login-form" onsubmit="hacerLogin(event)">
            <div class="field-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" class="input-pill" placeholder="Admin / User" required>
            </div>

            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="input-pill" placeholder="*******" required>
            </div>

            <button type="submit" class="btn-login-pill">Iniciar Sesión</button>
            
            <!-- Disparador del Modal de Reestablecer -->
            <a href="#" class="forgot-password" data-bs-toggle="modal" data-bs-target="#resetModal">¿Olvidaste tu contraseña?</a>
            <p id="error-msg" class="mt-3 mb-0"></p>
        </form>
    </div>
</div>

<!-- Modal Restablecer Contraseña -->
<div class="modal fade" id="resetModal" tabindex="-1" aria-labelledby="resetModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="resetModalLabel">Restablecer Contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form onsubmit="restablecerPassword(event)">
        <div class="modal-body">
            <p class="text-muted small mb-3">Ingresa tu usuario y la nueva contraseña para actualizar el acceso.</p>
            <div class="field-group">
                <label for="resetUsuario">Usuario</label>
                <input type="text" id="resetUsuario" class="input-pill" placeholder="Ej: admin" required>
            </div>
            <div class="field-group">
                <label for="resetPassword">Nueva Contraseña</label>
                <input type="password" id="resetPassword" class="input-pill" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div id="reset-msg" class="mt-2 small text-center"></div>
        </div>
        <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn-login-pill w-auto px-4 mt-0">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_BASE = (window.location.port === '5500') ? 'http://127.0.0.1:3000' : '';

    async function hacerLogin(event) {
        event.preventDefault();

        const errorMsg = document.getElementById('error-msg');
        const usuarioInput = document.getElementById('usuario').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        errorMsg.style.color = '#d85d00';
        errorMsg.innerText = '⏳ Cargando...';

        try {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                errorMsg.style.color = '#2e7d32';
                errorMsg.innerText = '✅ ¡Éxito! Redirigiendo...';

                localStorage.setItem('session', JSON.stringify({
                    nombre: data.usuario ? data.usuario.nombre : usuarioInput,
                    username: usuarioInput,
                    rol: data.usuario ? data.usuario.rol : (data.rol || 'administrador')
                }));

                setTimeout(() => {
                    window.location.href = 'modulos.html';
                }, 600);
            } else {
                errorMsg.style.color = '#c0392b';
                errorMsg.innerText = data.mensaje || data.message || 'Usuario o contraseña incorrectos';
            }
        } catch (err) {
            errorMsg.style.color = '#c0392b';
            errorMsg.innerText = 'Error al conectar con el servidor';
        }
    }

    async function restablecerPassword(event) {
        event.preventDefault();
        const resetMsg = document.getElementById('reset-msg');
        const username = document.getElementById('resetUsuario').value.trim();
        const newPassword = document.getElementById('resetPassword').value.trim();

        resetMsg.style.color = '#d85d00';
        resetMsg.innerText = '⏳ Actualizando contraseña...';

        try {
            const res = await fetch(`${API_BASE}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, newPassword })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                resetMsg.style.color = '#2e7d32';
                resetMsg.innerText = '✅ Contraseña actualizada con éxito. Ya puedes iniciar sesión.';
                setTimeout(() => {
                    const modalEl = document.getElementById('resetModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                    resetMsg.innerText = '';
                }, 2000);
            } else {
                resetMsg.style.color = '#c0392b';
                resetMsg.innerText = data.mensaje || 'No se pudo actualizar la contraseña';
            }
        } catch (err) {
            resetMsg.style.color = '#c0392b';
            resetMsg.innerText = 'Error al conectar con el servidor';
        }
    }
</script>

</body>
</html>
