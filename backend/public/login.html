<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SGIFEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #2b2b2b; /* Fondo oscuro exterior */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Contenedor flotante tipo tarjeta */
    .login-container {
        width: 90%;
        max-width: 950px;
        background: #ffffff;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        display: flex;
        min-height: 520px;
    }

    /* Lado izquierdo: Imagen de herramientas */
    .login-image-side {
        width: 48%;
        background: url('img/herramientas.jpg') center/cover no-repeat; 
        position: relative;
        border-top-left-radius: 24px;
        border-bottom-left-radius: 24px;
    }

    /* Fallback por si la imagen aún no existe */
    .login-image-side::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.1);
    }

    /* Lado derecho: Formulario */
    .login-form-side {
        width: 52%;
        padding: 40px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
    }

    .brand-logo {
        max-width: 150px;
        height: auto;
        margin-bottom: 30px;
    }

    .login-form {
        width: 100%;
        max-width: 320px;
    }

    .field-group {
        margin-bottom: 20px;
    }

    .field-group label {
        display: block;
        font-weight: 600;
        font-size: 0.95rem;
        color: #111111;
        margin-bottom: 8px;
    }

    /* Inputs ovalados (pill style) */
    .input-pill {
        width: 100%;
        padding: 10px 20px;
        border-radius: 25px;
        border: 1.5px solid #4a4a4a;
        outline: none;
        font-size: 0.9rem;
        color: #333;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-pill::placeholder {
        color: #777777;
        font-weight: 500;
    }

    .input-pill:focus {
        border-color: #d85d00;
        box-shadow: 0 0 5px rgba(216, 93, 0, 0.3);
    }

    /* Botón naranja ovalado */
    .btn-login-pill {
        width: 100%;
        background-color: #d85d00;
        color: #ffffff;
        border: none;
        border-radius: 25px;
        padding: 11px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(216, 93, 0, 0.3);
        transition: background-color 0.2s, transform 0.1s;
    }

    .btn-login-pill:hover {
        background-color: #c05200;
    }

    .btn-login-pill:active {
        transform: scale(0.98);
    }

    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #d93838;
        font-weight: 600;
        font-size: 0.88rem;
        text-decoration: none;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    #error-msg {
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
    }

    /* Responsive para pantallas pequeñas */
    @media (max-width: 768px) {
        .login-container {
            flex-direction: column;
            max-width: 420px;
        }
        .login-image-side {
            width: 100%;
            height: 180px;
            border-radius: 24px 24px 0 0;
        }
        .login-form-side {
            width: 100%;
            padding: 30px 25px;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <!-- Imagen lateral izquierda -->
    <div class="login-image-side"></div>

    <!-- Formulario de inicio de sesión -->
    <div class="login-form-side">
        <!-- Logo de SGIFEP -->
        <img src="img/logo.png" alt="SGIFEP Logo" class="brand-logo">

        <form class="login-form" onsubmit="hacerLogin(event)">
            <div class="field-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" class="input-pill" placeholder="Admin / User" required>
            </div>

            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="input-pill" placeholder="*******" required>
            </div>

            <button type="submit" class="btn-login-pill">Iniciar Sesión</button>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            <p id="error-msg" class="mt-3 mb-0"></p>
        </form>
    </div>
</div>

<script>
    async function hacerLogin(event) {
        event.preventDefault();

        const errorMsg = document.getElementById('error-msg');
        const usuarioInput = document.getElementById('usuario').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        errorMsg.style.color = '#d85d00';
        errorMsg.innerText = '⏳ Cargando...';

        const API_BASE = (window.location.port === '5500') ? 'http://127.0.0.1:3000' : '';

        try {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                errorMsg.style.color = '#2e7d32';
                errorMsg.innerText = '✅ ¡Éxito! Redirigiendo...';

                localStorage.setItem('session', JSON.stringify({
                    nombre: data.usuario ? data.usuario.nombre : usuarioInput,
                    username: usuarioInput,
                    rol: data.usuario ? data.usuario.rol : (data.rol || 'administrador')
                }));

                setTimeout(() => {
                    window.location.href = 'modulos.html';
                }, 600);
            } else {
                errorMsg.style.color = '#c0392b';
                errorMsg.innerText = data.mensaje || data.message || 'Usuario o contraseña incorrectos';
            }
        } catch (err) {
            errorMsg.style.color = '#c0392b';
            errorMsg.innerText = 'Error al conectar con el servidor';
        }
    }
</script>

</body>
</html>
