<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos del Sistema - SGIFEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body class="landing-modern">

<header class="dashboard-modern-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <img src="img/logo.png" alt="Ferretería El Constructor" class="brand-badge">
            <span class="fw-bold">SGIFEP - Sistema integral</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span id="userInfo" class="small"></span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </div>
    </div>
</header>

<section class="py-5">
    <div class="container py-3">
        <h2 class="fw-bold" style="color:var(--navy)">Módulos del sistema</h2>
        <p class="text-muted mb-4">Seleccioná el módulo al que deseás ingresar según tus permisos asignados.</p>
        <div class="row g-3 row-cols-1 row-cols-sm-2 row-cols-lg-3" id="modulosContainer"></div>
    </div>
</section>

<script>
    const user = JSON.parse(localStorage.getItem('session'));

    if (!user) {
        window.location.href = 'login.html';
    } else {
        const nombreMostrar = user.nombre || user.username || 'Usuario';
        document.getElementById('userInfo').innerHTML = `Usuario: <strong>${nombreMostrar}</strong> <span class="badge badge-rol ms-1">${user.rol}</span>`;

        const modulos = [
            { id: 'ventas', nombre: 'Ventas y Cotizaciones', icon: '🛒', roles: ['administrador', 'admin', 'ventas'] },
            { id: 'bodega', nombre: 'Bodega e Inventario', icon: '📦', roles: ['administrador', 'admin', 'bodega'] },
            { id: 'reparto', nombre: 'Reparto', icon: '🚚', roles: ['administrador', 'admin', 'reparto'] },
            { id: 'caja', nombre: 'Caja', icon: '💵', roles: ['administrador', 'admin', 'caja'] },
            { id: 'reportes', nombre: 'Reportes', icon: '📊', roles: ['administrador', 'admin', 'caja'] },
            { id: 'usuarios', nombre: 'Gestión de Usuarios', icon: '⚙️', roles: ['administrador', 'admin'] }
        ];

        const container = document.getElementById('modulosContainer');
        modulos.forEach(m => {
            if (m.roles.includes(user.rol)) {
                container.innerHTML += `
                    <div class="col">
                        <div class="card-modulo-modern">
                            <div class="icon">${m.icon}</div>
                            <h4>${m.nombre}</h4>
                        </div>
                    </div>
                `;
            }
        });
    }

    function logout() {
        localStorage.removeItem('session');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
