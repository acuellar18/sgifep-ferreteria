<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SGIFEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body class="landing-modern">

<div class="login-modern-shell">
    <div class="login-modern-topbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <img src="img/logo.png" alt="Ferretería El Constructor" class="brand-badge">
                <span class="brand-text">
                    <span class="d-block">FERRETERÍA</span>
                    <span class="d-block fw-bold">EL CONSTRUCTOR</span>
                </span>
            </a>
            <a href="index.html" class="back-link">← Volver a la página principal</a>
        </div>
    </div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="login-card">
            <h2 class="h4">Acceso al sistema</h2>
            <p class="sub">Ingresá tus credenciales para continuar</p>
            <form onsubmit="hacerLogin(event)">
                <div class="field-modern">
                    <label>Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
                </div>
                <div class="field-modern">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                </div>
                <button type="submit" class="btn btn-amber w-100 mt-2">Ingresar</button>
            </form>
            <p id="error-msg" class="mt-3 small mb-0"></p>
        </div>
    </div>
</div>

<script>
    async function hacerLogin(event) {
        event.preventDefault();

        const errorMsg = document.getElementById('error-msg');
        const usuarioInput = document.getElementById('usuario').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        errorMsg.style.color = '#d98f1e';
        errorMsg.innerText = '⏳ Enviando petición a Node.js...';

        try {
            const res = await fetch('http://127.0.0.1:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                errorMsg.style.color = '#3a7d44';
                errorMsg.innerText = '✅ ¡Éxito! Redirigiendo...';

                localStorage.setItem('session', JSON.stringify({
                    nombre: data.usuario ? data.usuario.nombre : usuarioInput,
                    username: usuarioInput,
                    rol: data.usuario ? data.usuario.rol : (data.rol || 'administrador')
                }));

                setTimeout(() => {
                    window.location.href = 'modulos.html';
                }, 600);
            } else {
                errorMsg.style.color = '#c0392b';
                errorMsg.innerText = data.mensaje || data.message || 'Usuario o contraseña incorrectos';
            }
        } catch (err) {
            errorMsg.style.color = '#c0392b';
            errorMsg.innerText = 'Error al conectar con Node.js: ' + err.message;
        }
    }
</script>
</body>
</html>
