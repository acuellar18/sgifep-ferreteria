<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos del Sistema - SGIFEP</title>
<script>
    (function () {
        try {
            var t = localStorage.getItem('sgifep.tema');
            if (t === 'oscuro' || t === 'claro') {
                document.documentElement.setAttribute('data-tema', t);
            }
        } catch (e) {}
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets-modulos/sidebar.css">
<style>
    :root {
        --color-fondo: #f4f2ef;
        --color-icono-fondo: #fff7ed;
    }

    :root[data-tema='oscuro'] {
        --color-primario: #22c55e;
        --color-primario-oscuro: #16a34a;
        --color-primario-claro: #166534;
        --color-primario-suave: #12291b;
        --color-fondo: #101413;
        --color-fondo-suave: #1b211e;
        --color-superficie: #171d1a;
        --color-texto: #e6e9e7;
        --color-texto-suave: #9aa3a0;
        --color-borde: #2b332f;
        --color-acento-linea: #22c55e;
        --color-icono-fondo: #12291b;
        color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--color-texto);
        background: var(--color-fondo);
    }

    .modulos-main {
        flex: 1;
        padding: 50px 36px 70px;
        text-align: center;
        overflow-x: hidden;
    }

    .bienvenida {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 2.7rem;
        color: var(--color-texto);
        margin: 0 0 40px;
    }

    .modulos-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(260px, 1fr));
        gap: 24px;
        max-width: 1140px;
        margin: 0 auto;
        text-align: left;
    }

    .card-modulo {
        background: var(--color-superficie);
        border-radius: 16px;
        padding: 24px 22px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        text-decoration: none;
        color: inherit;
    }

    .card-modulo:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.11);
    }

    .icon-circle {
        width: 60px;
        height: 60px;
        min-width: 60px;
        border-radius: 50%;
        background: var(--color-icono-fondo);
        color: var(--color-primario);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-circle svg {
        width: 28px;
        height: 28px;
    }

    .card-modulo h4 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.02rem;
        font-weight: 700;
        color: var(--color-texto);
        margin: 0 0 5px;
        line-height: 1.2;
    }

    .card-modulo p {
        font-size: 0.84rem;
        color: var(--color-texto-suave);
        line-height: 1.4;
        margin: 0;
    }

    .acceder {
        display: inline-block;
        margin-top: 10px;
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--color-primario);
        letter-spacing: 0.3px;
    }

    @media (max-width: 1100px) {
        .modulos-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
        .modulos-grid { grid-template-columns: 1fr; }
        .bienvenida { font-size: 2rem; }
        .modulos-main { padding: 30px 16px 50px; }
    }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ico-usuarios" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </symbol>
    <symbol id="ico-compras" viewBox="0 0 24 24">
        <circle cx="8" cy="21" r="1" />
        <circle cx="19" cy="21" r="1" />
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
    </symbol>
    <symbol id="ico-inventario" viewBox="0 0 24 24">
        <path d="m7.5 4.27 9 5.15" />
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
        <path d="m3.3 7 8.7 5 8.7-5" />
        <path d="M12 22V12" />
    </symbol>
    <symbol id="ico-facturacion" viewBox="0 0 24 24">
        <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
        <path d="M12 17.5v-11" />
    </symbol>
    <symbol id="ico-despacho" viewBox="0 0 24 24">
        <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
        <path d="M15 18H9" />
        <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
        <circle cx="17" cy="18" r="2" />
        <circle cx="7" cy="18" r="2" />
    </symbol>
    <symbol id="ico-reportes" viewBox="0 0 24 24">
        <path d="M3 3v18h18" />
        <path d="M18 17V9" />
        <path d="M13 17V5" />
        <path d="M8 17v-3" />
    </symbol>
    <symbol id="ico-caja" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 9h18" />
        <path d="M7 14h4" />
        <circle cx="17" cy="14" r="1" />
    </symbol>
    <symbol id="ico-pos" viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="12" rx="2" />
        <path d="M7 8V4h10v4" />
        <path d="M8 13h8" />
        <path d="M8 17h4" />
    </symbol>
    <symbol id="ico-perfil" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
    </symbol>
    <symbol id="ico-avatar" viewBox="0 0 24 24">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
    </symbol>
</svg>

<div class="layout">
    <header class="app-header">
        <div class="header-logo-box">
            <img src="/img/logo.png" alt="Ferretería El Puente" class="header-logo">
        </div>
        <button type="button" class="menu-toggle" id="btnMenuToggle" aria-label="Alternar menú" aria-expanded="false" aria-controls="sidebarLayout">☰</button>
        <div class="header-titulos">
            <span class="header-titulo-naranja">MÓDULOS</span>
            <span class="header-subtitulo-blanco">PANEL DE ACCESO</span>
        </div>
        <div class="header-usuario">
            <span class="avatar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-avatar" /></svg>
            </span>
            <div class="header-usuario-info">
                <span class="header-nombre" id="userInfo">Usuario</span>
                <span class="rol-badge" id="userRol">usuario</span>
            </div>
            <button type="button" class="logout-link" id="btnLogout">Cerrar sesión</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="drawer" id="sidebarLayout">
            <div class="drawer-cabecera">
                <span class="drawer-logo">SGIFEP</span>
            </div>
            <nav class="drawer-nav" id="navModulos" aria-label="Menú de módulos"></nav>
        </aside>

        <div class="contenido">
            <main class="modulos-main">
                <h1 class="bienvenida" id="bienvenidaTitulo">Bienvenido (a)</h1>
                <div class="modulos-grid" id="modulosContainer"></div>
            </main>
        </div>
    </div>
</div>

<script src="assets-modulos/sistema-modulos.js"></script>
<script>
    const BASE_USUARIOS = '/usuarios/';
    const RUTA_LOGIN = '/login.html';
    const RUTA_MODULOS = '/modulos.html';
    const SGIFEPPermisos = window.SGIFEPPermisos;

    const ICONOS = {
        caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-caja" /></svg>',
        pos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-pos" /></svg>',
        compras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-compras" /></svg>',
        inventario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-inventario" /></svg>',
        facturacion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-facturacion" /></svg>',
        despacho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-despacho" /></svg>',
        reportes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-reportes" /></svg>',
        usuarios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-usuarios" /></svg>'
    };

    // Catálogo del menú lateral y del panel de acceso. Las rutas son relativas
    // a /usuarios/; la visibilidad la resuelve SGIFEPPermisos, la misma regla
    // que usan las páginas estáticas y el layout React.
    const MENU = [
        {
            id: 'caja',
            icono: 'caja',
            titulo: 'Caja',
            ruta: 'caja',
            permiso: 'caja'
        },
        {
            id: 'pos',
            icono: 'pos',
            titulo: 'POS / Venta',
            ruta: 'pos',
            permiso: 'pos'
        },
        {
            id: 'usuarios',
            icono: 'usuarios',
            titulo: 'Usuarios',
            permiso: 'usuarios',
            subpaginas: [
                { id: 'listado', etiqueta: 'Listado de Usuarios', ruta: '', permiso: 'usuarios' },
                { id: 'reporte', etiqueta: 'Reporte de Usuarios', ruta: 'reporte', permiso: 'usuarios' },
                { id: 'roles', etiqueta: 'Gestión de Roles', ruta: 'roles', permiso: 'usuarios' },
                { id: 'departamentos', etiqueta: 'Gestión de Departamentos', ruta: 'departamentos', permiso: 'usuarios' }
            ]
        },
        {
            id: 'compras',
            icono: 'compras',
            titulo: 'Compras',
            permiso: 'compras',
            subpaginas: [
                { id: 'proveedores', etiqueta: 'Proveedores', ruta: 'compras/proveedores', permiso: 'compras' },
                { id: 'nueva', etiqueta: 'Registrar compra', ruta: 'compras/facturas/nueva', permiso: 'crearCompra' },
                { id: 'facturas', etiqueta: 'Facturas y pagos', ruta: 'compras/facturas', permiso: 'compras' }
            ]
        },
        {
            id: 'inventario',
            icono: 'inventario',
            titulo: 'Inventario',
            permiso: 'inventario',
            subpaginas: [
                { id: 'productos', etiqueta: 'Productos', ruta: 'inventario/productos', permiso: 'inventario' },
                { id: 'categorias', etiqueta: 'Categorías', ruta: 'inventario/categorias', permiso: 'inventarioGestion' },
                { id: 'movimientos', etiqueta: 'Movimientos de Inventario', ruta: 'inventario/movimientos', permiso: 'inventarioGestion' }
            ]
        },
        {
            id: 'facturacion',
            icono: 'facturacion',
            titulo: 'Facturación',
            permiso: 'facturacion',
            subpaginas: [
                { id: 'listado', etiqueta: 'Listado de Facturas', ruta: 'facturacion/facturas', permiso: 'facturacion' },
                { id: 'clientes', etiqueta: 'Clientes', ruta: 'facturacion/clientes', permiso: 'facturacion' }
            ]
        },
        {
            id: 'despacho',
            icono: 'despacho',
            titulo: 'Despacho',
            permiso: 'despacho',
            subpaginas: [
                { id: 'listado', etiqueta: 'Listado de Despachos', ruta: 'despacho', permiso: 'despacho' }
            ]
        },
        {
            id: 'reportes',
            icono: 'reportes',
            titulo: 'Reportes',
            subpaginas: [
                { id: 'general', etiqueta: 'Reporte General', ruta: 'reportes', permiso: 'reporteGeneral' },
                { id: 'ventas', etiqueta: 'Reporte de Ventas', ruta: 'reportes/ventas', permiso: 'reporteFacturacion' },
                { id: 'auditoria', etiqueta: 'Auditoría', ruta: 'seguridad/auditoria', permiso: 'auditoria', soloAdmin: true },
                { id: 'compras', etiqueta: 'Reporte de Compras', ruta: 'reportes/compras', permiso: 'reporteCompras' },
                { id: 'inventario', etiqueta: 'Reporte de Inventario', ruta: 'reportes/inventario', permiso: 'reporteInventario' }
            ]
        },
        {
            id: 'perfil',
            icono: 'perfil',
            titulo: 'Mi perfil',
            ruta: 'perfil'
        }
    ];

    const TARJETAS = [
        { id: 'compras', nombre: 'Compras y Abastecimiento', desc: 'Registre proveedores, compras, facturas y pagos.' },
        { id: 'inventario', nombre: 'Control de Inventario', desc: 'Administre su inventario de productos.' },
        { id: 'facturacion', nombre: 'Facturación y Cobro', desc: 'Facture y registre sus cobros.' },
        { id: 'caja', nombre: 'Caja y Turnos', desc: 'Abra y cierre la caja, controle el efectivo del turno.' },
        { id: 'pos', nombre: 'POS / Venta', desc: 'Punto de venta, historial y cuentas por cobrar.' },
        { id: 'despacho', nombre: 'Despacho de Productos', desc: 'Despache productos a sus clientes.' },
        { id: 'reportes', nombre: 'Reportes', desc: 'Consulte reportes y estadísticas.' },
        { id: 'usuarios', nombre: 'Usuarios', desc: 'Gestione los usuarios.' }
    ];

    function escapar(texto) {
        return String(texto)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function iconoDrawer(id) {
        return '<svg class="drawer-item-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ico-' + id + '" /></svg>';
    }

    function urlModulo(modulo, sesion) {
        if (modulo.ruta) return BASE_USUARIOS + modulo.ruta;
        const subpagina = SGIFEPPermisos.subpaginasVisibles(modulo, sesion)[0];
        return subpagina ? BASE_USUARIOS + subpagina.ruta : null;
    }

    function construirDrawer(sesion) {
        const nav = document.getElementById('navModulos');
        if (!nav || !SGIFEPPermisos) return;

        let html = '<a href="' + RUTA_MODULOS + '" class="drawer-item modulo-activo">' +
            '<span>Módulos Principales</span></a>';

        MENU.forEach((modulo) => {
            if (!SGIFEPPermisos.moduloVisible(modulo, sesion)) return;

            if (modulo.subpaginas) {
                html += '<button type="button" class="drawer-item" data-menu-toggle="' + modulo.id + '"' +
                    ' aria-expanded="false" aria-controls="subitems-' + modulo.id + '">' +
                    '<span class="drawer-item-texto">' +
                        iconoDrawer(modulo.icono) +
                        '<span>' + escapar(modulo.titulo) + '</span>' +
                    '</span>' +
                    '<span class="drawer-flecha">▸</span>' +
                '</button>';
                html += '<div class="drawer-subitems" id="subitems-' + modulo.id + '" hidden>';
                SGIFEPPermisos.subpaginasVisibles(modulo, sesion).forEach((sub) => {
                    html += '<a class="drawer-subitem" href="' + BASE_USUARIOS + sub.ruta + '">' +
                        escapar(sub.etiqueta) + '</a>';
                });
                html += '</div>';
                return;
            }

            html += '<a href="' + BASE_USUARIOS + modulo.ruta + '" class="drawer-item">' +
                '<span class="drawer-item-texto">' +
                    iconoDrawer(modulo.icono) +
                    '<span>' + escapar(modulo.titulo) + '</span>' +
                '</span>' +
            '</a>';
        });

        nav.innerHTML = html;
        activarAcordeon();
    }

    function activarAcordeon() {
        document.querySelectorAll('[data-menu-toggle]').forEach((boton) => {
            boton.addEventListener('click', () => {
                const id = boton.getAttribute('data-menu-toggle');
                const bloque = document.getElementById(`subitems-${id}`);
                const estabaOculto = bloque.hidden;

                document.querySelectorAll('.drawer-subitems').forEach((otro) => {
                    otro.hidden = true;
                });
                document.querySelectorAll('[data-menu-toggle]').forEach((otro) => {
                    otro.setAttribute('aria-expanded', 'false');
                    otro.querySelector('.drawer-flecha')?.classList.remove('abierto');
                });

                if (estabaOculto) {
                    bloque.hidden = false;
                    boton.setAttribute('aria-expanded', 'true');
                    boton.querySelector('.drawer-flecha')?.classList.add('abierto');
                }
            });
        });
    }

    const menuToggle = document.getElementById('btnMenuToggle');
    const sidebarLayout = document.getElementById('sidebarLayout');

    function esEscritorio() {
        return window.matchMedia('(min-width: 701px)').matches;
    }

    function sincronizarBotonMenu() {
        menuToggle.setAttribute(
            'aria-expanded',
            sidebarLayout.classList.contains('drawer-abierto') ? 'true' : 'false'
        );
    }

    if (esEscritorio()) {
        sidebarLayout.classList.add('drawer-abierto');
    }
    sincronizarBotonMenu();

    menuToggle.addEventListener('click', () => {
        sidebarLayout.classList.toggle('drawer-abierto');
        sincronizarBotonMenu();
    });

    window.matchMedia('(min-width: 701px)').addEventListener('change', (evento) => {
        sidebarLayout.classList.toggle('drawer-abierto', evento.matches);
        sincronizarBotonMenu();
    });

    document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && !esEscritorio()) {
            sidebarLayout.classList.remove('drawer-abierto');
            sincronizarBotonMenu();
        }
    });

    const sesion = JSON.parse(localStorage.getItem('session') || 'null');

    if (!sesion || !sesion.token) {
        window.location.replace(RUTA_LOGIN);
    } else {
        const nombreMostrar = sesion.nombre || sesion.username || 'Usuario';
        const roles = sesion.roles?.length ? sesion.roles : [sesion.rol || 'usuario'];

        construirDrawer(sesion);

        document.getElementById('userInfo').textContent = nombreMostrar;
        document.getElementById('userRol').textContent = roles.join(', ');
        document.getElementById('bienvenidaTitulo').textContent = `Bienvenido, ${nombreMostrar}`;

        // Cargar y mostrar la foto de perfil del usuario autenticado.
        fetch('/api/perfil/foto', { headers: { Authorization: `Bearer ${sesion.token}` } })
            .then((res) => (res.ok ? res.blob() : null))
            .then((blob) => {
                if (!blob) return;
                const avatar = document.querySelector('.header-usuario .avatar');
                if (!avatar) return;
                const img = document.createElement('img');
                img.alt = `Foto de ${nombreMostrar}`;
                img.src = URL.createObjectURL(blob);
                avatar.innerHTML = '';
                avatar.appendChild(img);
            })
            .catch(() => {});

        const container = document.getElementById('modulosContainer');

        TARJETAS.forEach((tarjeta) => {
            const modulo = MENU.find((item) => item.id === tarjeta.id);
            if (!modulo || !SGIFEPPermisos.moduloVisible(modulo, sesion)) return;

            const url = urlModulo(modulo, sesion);
            if (!url) return;

            container.insertAdjacentHTML('beforeend', `
                <a class="card-modulo" href="${url}">
                    <div class="icon-circle">${ICONOS[modulo.icono] || ''}</div>
                    <div>
                        <h4>${tarjeta.nombre}</h4>
                        <p>${tarjeta.desc}</p>
                        <span class="acceder">Ingresar al módulo →</span>
                    </div>
                </a>
            `);
        });
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
        localStorage.removeItem('session');
        window.location.href = RUTA_LOGIN;
    });
</script>
</body>
</html>
