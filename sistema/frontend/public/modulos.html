<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulos del Sistema - SGIFEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Inter', sans-serif;
        color: #1a1a1a;
        background: #f4f2ef;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ===== HEADER ===== */
    .modulos-header {
        display: flex;
        align-items: center;
        background: #141414;
        min-height: 84px;
        border-bottom: 4px solid #f2701d;
        position: sticky;
        top: 0;
        z-index: 1000;
        padding-right: 20px;
    }

    .logo-box {
        width: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .logo-box img {
        max-width: 80px;
        max-height: 60px;
        object-fit: contain;
    }

    .menu-toggle {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 1.8rem;
        padding: 0 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        transition: color 0.2s ease;
    }
    .menu-toggle:hover {
        color: #f2701d;
    }

    .header-title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.15;
    }

    .title-orange {
        color: #f2701d;
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 1.7rem;
        letter-spacing: 0.5px;
    }

    .subtitle-white {
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 2px;
    }

    .user-chip {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ffffff;
    }

    .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #d9d9d9;
        color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
    }

    .user-chip .rol-badge {
        background: #f7a567;
        color: #141414;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 10px;
        margin-left: 6px;
    }

    .logout-link {
        color: #cccccc;
        font-size: 0.8rem;
        text-decoration: none;
        margin-left: 14px;
        border-left: 1px solid #444;
        padding-left: 14px;
        cursor: pointer;
        background: none;
        border-top: none;
        border-bottom: none;
        border-right: none;
        font-family: 'Inter', sans-serif;
    }
    .logout-link:hover { color: #ffffff; }

    /* ===== CONTENEDOR GENERAL ===== */
    .app-container {
        display: flex;
        flex: 1;
        position: relative;
        min-height: calc(100vh - 84px);
    }

    /* ===== SIDEBAR FIJO ADAPTABLE ===== */
    .sidebar-layout {
        width: 0;
        background: #ffffff;
        border-right: 1px solid #e0deda;
        transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .sidebar-layout.active {
        width: 270px;
    }

    .sidebar-top {
        background: #141414;
        padding: 16px 20px;
        display: flex;
        align-items: center;
    }

    .sidebar-brand-title {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 1.3rem;
        color: #f2701d;
        letter-spacing: 0.5px;
    }

    .sidebar-nav {
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        color: #2b2b2b;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.88rem;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .sidebar-nav a:hover {
        background: #fff4ec;
        color: #f2701d;
    }

    .sidebar-nav a.active-link {
        background: #fff2e8;
        color: #d95808;
    }

    /* ===== CONTENIDO PRINCIPAL ===== */
    .modulos-main {
        flex: 1;
        padding: 50px 36px 70px;
        text-align: center;
        transition: all 0.28s ease;
        overflow-x: hidden;
    }

    .bienvenida {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 2.7rem;
        color: #111111;
        margin-bottom: 40px;
    }

    .modulos-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(260px, 1fr));
        gap: 24px;
        max-width: 1140px;
        margin: 0 auto;
        text-align: left;
    }

    .card-modulo {
        background: #ffffff;
        border-radius: 16px;
        padding: 24px 22px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.06);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        text-decoration: none;
        color: inherit;
    }

    a.card-modulo { cursor: pointer; }

    .card-modulo:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(0,0,0,0.11);
    }

    .icon-circle {
        width: 60px;
        height: 60px;
        min-width: 60px;
        border-radius: 50%;
        background: #f7a567;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
    }

    .card-modulo h4 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.02rem;
        font-weight: 700;
        color: #111111;
        margin-bottom: 5px;
        line-height: 1.2;
    }

    .card-modulo p {
        font-size: 0.84rem;
        color: #555555;
        line-height: 1.4;
    }

    .acceder {
        display: inline-block;
        margin-top: 10px;
        font-size: 0.76rem;
        font-weight: 700;
        color: #f2701d;
        letter-spacing: 0.3px;
    }

    @media (max-width: 1100px) {
        .modulos-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
        .modulos-grid { grid-template-columns: 1fr; }
        .header-title { display: none; }
        .sidebar-layout.active { width: 240px; }
        .bienvenida { font-size: 2rem; }
        .modulos-main { padding: 30px 16px 50px; }
    }
</style>
</head>
<body>

<header class="modulos-header">
    <div class="logo-box">
        <img src="/img/logo.png" alt="Ferretería El Puente" onerror="this.src='/usuarios/img/logo.png'">
    </div>
    <button class="menu-toggle" id="btnMenuToggle" aria-label="Alternar menú">☰</button>
    <div class="header-title">
        <span class="title-orange">MÓDULOS</span>
        <span class="subtitle-white">PANEL DE ACCESO</span>
    </div>
    <div class="user-chip">
        <span class="avatar">👤</span>
        <span id="userInfo">Usuario</span>
        <button onclick="logout()" class="logout-link">Cerrar sesión</button>
    </div>
</header>

<div class="app-container">
    <aside class="sidebar-layout" id="sidebarLayout">
        <div class="sidebar-top">
            <span class="sidebar-brand-title">SGIFEP</span>
        </div>
        <nav class="sidebar-nav">
            <a href="modulos.html" class="active-link"><span>🏠</span> Módulos Principales</a>
            <a href="/usuarios/"><span>👥</span> Usuarios</a>
            <a href="/compras/"><span>🛒</span> Compras</a>
            <a href="/inventario/"><span>📦</span> Inventario</a>
            <a href="/facturacion/"><span>🧾</span> Facturación</a>
            <a href="/despacho/"><span>📤</span> Despacho</a>
            <a href="/reportes/"><span>📊</span> Reportes</a>
        </nav>
    </aside>

    <main class="modulos-main">
        <h1 class="bienvenida" id="bienvenidaTitulo">Bienvenido (a)</h1>
        <div class="modulos-grid" id="modulosContainer"></div>
    </main>
</div>

<script>
    // Alternar menú sin cambiar el icono de las 3 barritas
    const menuToggle = document.getElementById('btnMenuToggle');
    const sidebarLayout = document.getElementById('sidebarLayout');

    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            sidebarLayout.classList.toggle('active');
        });
    }

    // Sesión y listado de módulos
    const user = JSON.parse(localStorage.getItem('session'));

    if (!user) {
        window.location.href = 'login.html';
    } else {
        const nombreMostrar = user.nombre || user.username || 'Usuario';
        document.getElementById('userInfo').innerHTML = `${nombreMostrar} <span class="rol-badge">${user.rol}</span>`;
        document.getElementById('bienvenidaTitulo').textContent = `Bienvenido, ${nombreMostrar}`;

        const modulos = [
            { id: 'compras', nombre: 'Compras y Abastecimiento', icon: '🛒', desc: 'Gestione sus compras y proveedores.', roles: ['administrador', 'admin', 'compras'] },
            { id: 'inventario', nombre: 'Control de Inventario', icon: '📦', desc: 'Administre su inventario de productos.', roles: ['administrador', 'admin', 'bodega'] },
            { id: 'facturacion', nombre: 'Facturación y Cobro', icon: '🧾', desc: 'Facture y registre sus cobros.', roles: ['administrador', 'admin', 'caja'] },
            { id: 'despacho', nombre: 'Despacho de Productos', icon: '📤', desc: 'Despache productos a sus clientes.', roles: ['administrador', 'admin', 'reparto'] },
            { id: 'reportes', nombre: 'Reportes', icon: '📊', desc: 'Consulte reportes y estadísticas.', roles: ['administrador', 'admin', 'caja'] },
            { id: 'usuarios', nombre: 'Usuarios', icon: '⚙️', desc: 'Gestione los usuarios.', roles: ['administrador', 'admin', 'superadmin'], url: '/usuarios/' }
        ];

        const container = document.getElementById('modulosContainer');
        modulos.forEach(m => {
            if (m.roles.includes(user.rol)) {
                if (m.url) {
                    container.innerHTML += `
                        <a class="card-modulo" href="${m.url}">
                            <div class="icon-circle">${m.icon}</div>
                            <div>
                                <h4>${m.nombre}</h4>
                                <p>${m.desc}</p>
                                <span class="acceder">Ingresar al módulo →</span>
                            </div>
                        </a>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="card-modulo">
                            <div class="icon-circle">${m.icon}</div>
                            <div>
                                <h4>${m.nombre}</h4>
                                <p>${m.desc}</p>
                            </div>
                        </div>
                    `;
                }
            }
        });
    }

    function logout() {
        localStorage.removeItem('session');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
